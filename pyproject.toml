[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-converter"
version = "0.1.0"
description = "Vendor-neutral course migration between Moodle and Open edX with verifiable fidelity."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Team Delta" }]
keywords = [
    "lms",
    "moodle",
    "openedx",
    "course-migration",
    "education",
    "scorm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.57.0"]

[project.urls]
Homepage = "https://github.com/olgakazarina-guds/Team-Delta"
Repository = "https://github.com/olgakazarina-guds/Team-Delta"
Issues = "https://github.com/olgakazarina-guds/Team-Delta/issues"
Changelog = "https://github.com/olgakazarina-guds/Team-Delta/blob/phase2/lms-migration/CHANGELOG.md"

[project.scripts]
lms-converter = "cli.main:app"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["adapters*", "cli*", "core*", "domain*", "persistence*"]
exclude = ["data*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data", "dist", "docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"] # Fixture XML data lines
"tests/*" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
files = ["adapters", "cli", "core", "domain", "persistence"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_reexport = true

[tool.coverage.run]
source = ["adapters", "cli", "core", "domain", "persistence"]

[tool.coverage.report]
show_missing = true
precision = 1
fail_under = 80

[tool.bandit]
targets = ["adapters", "cli", "core", "domain", "persistence"]
exclude_dirs = ["tests", "data", "dist", "docs", ".venv"]
