[project]
name = "lms-converter"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "streamlit>=1.57.0",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
]

[tool.setuptools]
packages = ["cli", "core", "data", "domain", "adapters", "persistence"]

[project.scripts]
lms-converter = "cli.main:app"
